<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>桌宠</title>
    <style>
      /* the window itself is transparent; only the character is drawn */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* no text selection or drag on a pet */
        user-select: none;
        -webkit-user-drag: none;
      }
      #pet {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        font: 12px/1.5 "Microsoft YaHei", system-ui, sans-serif;
        color: #fff;
        text-shadow: 0 1px 3px rgb(0 0 0 / 70%);
        pointer-events: none;
      }
      #status.error {
        color: #ffd6d6;
      }
    </style>
  </head>
  <body>
    <canvas id="pet"></canvas>
    <div id="status"></div>
    <!-- Cubism Core must be evaluated BEFORE the bundle: pixi-live2d-display checks
         window.Live2DCubismCore while its module body runs, so a dynamic load is too late. -->
    <script src="cubismcore.min.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
