<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>悬浮球</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-drag: none;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
      }

      /*
       * The ball itself: a compact disc that expands into an action row.
       *
       * It is pinned to the TOP of the window and given an explicit height, because the
       * window grows downwards when the result panel opens. `inset: 0` would stretch the
       * capsule over the whole window instead of keeping it a 60px bar.
       *
       * No `box-shadow` here: the window is an opaque rectangle for the compositor, so a
       * shadow that spills outside its bounds gets cut off and shows up as a black
       * rectangular edge. `filter: drop-shadow()` is drawn *inside* the page instead, so
       * it follows the capsule's real silhouette and is never clipped.
       */
      /*
       * The window is intentionally larger than the capsule (see ORB_W/PAD in the mod's
       * main service), so the shadow has room to fade. These offsets keep the capsule
       * centred inside that padded window.
       */
      :root {
        --orb-w: 294px;
        --pad: 8px;
        --capsule-h: 60px;
      }

      #orb {
        position: absolute;
        top: var(--pad);
        left: var(--pad);
        width: var(--orb-w);
        height: var(--capsule-h);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px;
        border-radius: 999px;
        background: rgb(28 26 34 / 88%);
        filter: drop-shadow(0 3px 9px rgb(0 0 0 / 50%));
        transition: width 200ms cubic-bezier(0.2, 0, 0, 1);
      }

      .btn {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        border: none;
        border-radius: 50%;
        background: rgb(255 255 255 / 10%);
        color: #f3e8ff;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 140ms ease, transform 120ms ease;
      }
      .btn:hover {
        background: rgb(199 125 255 / 35%);
      }
      .btn:active {
        transform: scale(0.92);
      }
      .btn.on {
        background: rgb(199 125 255 / 55%);
        color: #fff;
      }
      /* while recording, the mic button pulses so the state is obvious */
      .btn.recording {
        background: rgb(214 62 78 / 85%);
        color: #fff;
        animation: pulse 1.1s ease-in-out infinite;
      }
      /* while a voice line is playing, the mic glows in the accent colour instead */
      .btn.speaking {
        background: rgb(199 125 255 / 70%);
        color: #fff;
        box-shadow: 0 0 0 2px rgb(199 125 255 / 35%);
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgb(214 62 78 / 55%); }
        50% { box-shadow: 0 0 0 7px rgb(214 62 78 / 0%); }
      }

      /* the collapsed state is just the grip, centred in the padded window */
      body.collapsed #orb {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        justify-content: center;
        transform: translateX(calc((var(--orb-w) - 44px) / 2));
      }
      body.collapsed .btn:not(#grip) {
        display: none;
      }

      #grip {
        cursor: grab;
        background: transparent;
        color: #c77dff;
      }      #grip:active {
        cursor: grabbing;
      }

      #hint {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: -16px;
        font-size: 11px;
        color: #fff;
        text-shadow: 0 1px 3px rgb(0 0 0 / 70%);
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 160ms ease;
      }
      body:not(.collapsed) #hint {
        opacity: 0.85;
      }

      /*
       * The result panel.
       *
       * A one-line hint under the ball is unreadable for anything longer than a few
       * characters, and 识屏 / 听音 both produce a paragraph. The panel expands the window
       * downwards (the host grows the bounds) and lays the text out properly.
       */
      #panel {
        position: absolute;
        left: var(--pad);
        width: var(--orb-w);
        top: calc(var(--pad) + var(--capsule-h) + 6px);
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgb(28 26 34 / 94%);
        filter: drop-shadow(0 4px 12px rgb(0 0 0 / 45%));
        color: #f3e8ff;
        font-size: 12px;
        line-height: 1.55;
        display: none;
        max-height: 520px;
        overflow-y: auto;
      }
      body.separate-panel #panel {
        /* the window grows, so the panel can sit below the ball without clipping */
        display: block;
      }
      #panel .who {
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgb(199 125 255 / 95%);
        margin-bottom: 4px;
      }
      #panel .heard {
        color: #cfc6d8;
        font-size: 11px;
        margin-bottom: 6px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgb(255 255 255 / 10%);
        white-space: pre-wrap;
      }
      #panel .heard:empty {
        display: none;
      }
      #panel .body {
        white-space: pre-wrap;
        word-break: break-word;
      }
      #panel .body.error {
        color: #ffc9c9;
      }
      #panel .close {
        position: absolute;
        top: 6px;
        right: 8px;
        border: none;
        background: none;
        color: rgb(255 255 255 / 55%);
        font-size: 14px;
        cursor: pointer;
        padding: 2px 4px;
      }
      #panel .close:hover {
        color: #fff;
      }
      /* download progress bar for the whisper model */
      #bar {
        height: 3px;
        border-radius: 2px;
        background: rgb(255 255 255 / 14%);
        margin-top: 8px;
        overflow: hidden;
        display: none;
      }
      #bar.on {
        display: block;
      }
      #bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: #c77dff;
        transition: width 180ms linear;
      }

      /* the chat row only appears when the panel is used for typing */
      .chat-row {
        display: none;
        gap: 6px;
        margin-top: 8px;
        align-items: center;
      }
      body.chatting .chat-row {
        display: flex;
      }
      #chat-input {
        flex: 1 1 auto;
        min-width: 0;
        box-sizing: border-box;
        height: 28px;
        padding: 0 10px;
        border: none;
        border-radius: 14px;
        background: rgb(255 255 255 / 12%);
        color: #f3e8ff;
        font: 12px/28px "Microsoft YaHei", system-ui, sans-serif;
        outline: none;
      }
      #chat-input::placeholder {
        color: rgb(243 232 255 / 45%);
      }
      #chat-input:focus {
        background: rgb(255 255 255 / 18%);
      }
      #chat-send {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 50%;
        background: rgb(199 125 255 / 45%);
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      #chat-send:hover {
        background: rgb(199 125 255 / 70%);
      }
    </style>
  </head>
  <body class="collapsed">
    <div id="orb">
      <button class="btn" id="grip" title="拖动球 / 展开">●</button>
      <button class="btn" data-action="vision" title="识屏（VLM）">👁</button>
      <button class="btn" data-action="listen" title="听音（STT）">🎤</button>
      <button class="btn" data-action="chat" title="聊天（LLM）">💬</button>
      <button class="btn" id="drag-both" title="按住拖动：球和桌宠一起移动">✥</button>
      <button class="btn" data-action="settings" title="设置">⚙</button>
    </div>
    <div id="hint"></div>
    <div id="panel">
      <button class="close" id="panel-close" title="关闭">×</button>
      <div class="who" id="panel-who"></div>
      <div class="heard" id="panel-heard"></div>
      <div class="body" id="panel-body"></div>
      <div class="chat-row">
        <input id="chat-input" placeholder="说点什么…" autocomplete="off" />
        <button id="chat-send" title="发送">➤</button>
      </div>
      <div id="bar"><i></i></div>
    </div>
    <script src="orb.js"></script>
  </body>
</html>
