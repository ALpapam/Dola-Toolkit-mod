<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>悬浮球</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-drag: none;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
      }

      /* the ball itself: a compact disc that expands into an action row */
      #orb {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px;
        border-radius: 999px;
        background: rgb(28 26 34 / 88%);
        box-shadow: 0 6px 22px rgb(0 0 0 / 45%);
        transition: width 200ms cubic-bezier(0.2, 0, 0, 1);
      }

      .btn {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        border: none;
        border-radius: 50%;
        background: rgb(255 255 255 / 10%);
        color: #f3e8ff;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 140ms ease, transform 120ms ease;
      }
      .btn:hover {
        background: rgb(199 125 255 / 35%);
      }
      .btn:active {
        transform: scale(0.92);
      }
      .btn.on {
        background: rgb(199 125 255 / 55%);
        color: #fff;
      }

      /* the collapsed state is just the grip, so the orb stays out of the way */
      body.collapsed #orb {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        justify-content: center;
        transform: translateX(calc((240px - 44px) / 2 - 6px));
      }
      body.collapsed .btn:not(#grip) {
        display: none;
      }

      #grip {
        cursor: grab;
        background: transparent;
        color: #c77dff;
      }
      #grip:active {
        cursor: grabbing;
      }

      #hint {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: -18px;
        font-size: 11px;
        color: #fff;
        text-shadow: 0 1px 3px rgb(0 0 0 / 70%);
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 160ms ease;
      }
      body:not(.collapsed) #hint {
        opacity: 0.85;
      }
    </style>
  </head>
  <body class="collapsed">
    <div id="orb">
      <button class="btn" id="grip" title="拖动 / 展开">●</button>
      <button class="btn" data-action="vision" title="识屏（VLM）">👁</button>
      <button class="btn" data-action="listen" title="听音（STT）">🎤</button>
      <button class="btn" data-action="chat" title="聊天（LLM）">💬</button>
      <button class="btn" data-action="settings" title="设置">⚙</button>
    </div>
    <div id="hint"></div>
    <script src="orb.js"></script>
  </body>
</html>
